# Barrido de preguntas: el día 1 de cada mes, Claude Code (con el token de
# suscripción del dueño, no crédito de API) busca temas nuevos y preguntas
# obsoletas del último mes. Si hay cambios abre una pull request, que nunca se
# fusiona sola; si no, solo deja el resumen en el run. El prompt vive en
# .claude/skills/barrido-preguntas/SKILL.md.
#
# Mensual y sin guardar estado (05-10-2026): antes era cada 21 días con la fecha
# del último barrido en un fichero o una etiqueta, y eso obligaba a abrir PR o a
# mantener piezas solo para recordar una fecha. Si un run falla, se relanza a
# mano desde Actions.
name: Barrido de preguntas
on:
  schedule:
    - cron: '17 6 1 * *' # día 1 de cada mes, minuto raro para esquivar el pico de la hora en punto
  workflow_dispatch:
concurrency:
  group: barrido-preguntas
  cancel-in-progress: false
jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Desde cuándo mirar
        id: desde
        run: echo "fecha=$(date -u -d '1 month ago' +%F)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/barrido-preguntas desde ${{ steps.desde.outputs.fecha }}'
          claude_args: |
            --max-turns 80
            --model claude-sonnet-5
            --allowedTools "Bash(ls *),Bash(cat *),Bash(head *),Bash(wc *),Bash(date *),Bash(jq *),Bash(node scripts/validar-contenido.mjs),Bash(pnpm exec vitest run src/features/preguntas/coherencia.test.ts),Bash(git *),Bash(gh pr create *),Bash(curl *),Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
      # El resumen (qué fuentes se revisaron y qué se encontró) queda en la
      # pestaña del run, haya PR o no.
      - name: Resumen en el run
        if: always()
        run: |
          if [ -f barrido-resumen.md ]; then cat barrido-resumen.md >> "$GITHUB_STEP_SUMMARY"; fi
