# Migraciones de Supabase: se aplican solas al hacer push a main.
#
# Por qué (14-10-2026): las migraciones se pegaban a mano en el SQL Editor y la
# del día se quedó sin aplicar tras el push; producción iba con código que pedía
# columnas que no existían. Eudys quiere que todo cambio de un servicio salga con
# el push, sin pasos manuales en paneles.
#
# Qué hace: enlaza el proyecto con la CLI de Supabase y lanza `supabase db push`,
# que aplica solo las migraciones de supabase/migrations/ que la base no tiene
# registradas. Es el flujo que documenta Supabase en "Managing environments"
# (supabase.com/docs/guides/deployment/managing-environments, 14-10-2026).
#
# Las migraciones anteriores al 14-10-2026 se aplicaron a mano y no constan en
# el registro de Supabase: sin el paso "Registrar las aplicadas a mano", db push
# intentaría crear otra vez las tablas y fallaría. Marcarlas de nuevo es
# inofensivo, así que el paso se queda.
#
# Necesita dos secretos nuevos (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token personal (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   contraseña de la base (Project Settings > Database)
# y reutiliza SUPABASE_URL (la del latido) para sacar el identificador del proyecto.
#
# Las migraciones se escriben repetibles (if not exists, create or replace): si
# algo se aplicó a mano antes, volver a aplicarlo no rompe.
#
# A mano: pestaña Actions > Migraciones de Supabase > Run workflow.
name: Migraciones de Supabase

on:
  push:
    branches: [main]
    # También cuando cambia este fichero: así el primer push ya lo estrena.
    paths: ['supabase/migrations/**', '.github/workflows/migraciones-supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

# Dos pushes seguidos no aplican migraciones a la vez: el segundo espera.
concurrency:
  group: migraciones-supabase
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enlazar el proyecto
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::Faltan los secretos SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o SUPABASE_URL"
            exit 1
          fi
          # https://<ref>.supabase.co: el identificador es el subdominio.
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase link --project-ref "$ref"

      - name: Registrar las aplicadas a mano
        run: |
          for version in 20260914200000 20260915090000 20260929120000; do
            supabase migration repair --status applied "$version"
          done

      - name: Aplicar las pendientes
        run: supabase db push
